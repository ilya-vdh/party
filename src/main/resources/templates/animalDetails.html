<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/header :: headerelement}"></head>
<body class="home">
<div class="container-fluid mx-0 px-0">
  <div th:replace="~{fragments/header :: navbar}"></div>
  <a th:if="${previd != null}" th:href="@{|/animaldetails/${previd}|}" class="btn btn-primary">
    ← Vorige
  </a>


  <!-- Volgende knop -->
  <a th:if="${nextid != null}" th:href="@{|/animaldetails/${nextid}|}" class="btn btn-primary">
    Volgende →
  </a>
  <main class="m-3 container" th:object="${animal}" th:if="${animal}">
    <h2 th:text="*{animalname}"></h2>

    <p th:text="|woont in *{city}|"></p>
    <p th:text="*{bio}" class="col-6 border">bio</p>
    <h2 th:text="|*{animalname} gaat naar:|"></h2>
    <div class="container mt-5">
      <div class="row">
        <div th:each="party : ${animal.parties}" class="col-4">
          <div class="card-group">
            <div class="card m-1 p-2 text-center">
              <h3 th:text="${party.name}"></h3>
              <p th:text="${party.date}"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/header :: footerelement}"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
