<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/header :: headerelement}"></head>
<body class="home">
<div class="container-fluid mx-0 px-0" th:object="${party}" th:if="${party}">
    <div th:replace="~{fragments/header :: navbar}"></div>
    <h1 th:text="*{name}"></h1>
    <a th:if="${previd != null}" th:href="@{|/partydetails/${previd}|}" class="btn btn-primary">
        ← Vorige
    </a>


    <!-- Volgende knop -->
    <a th:if="${nextid != null}" th:href="@{|/partydetails/${nextid}|}" class="btn btn-primary">
        Volgende →
    </a>
    <main class="m-3 container" th:object="${party}" th:if="${party}">
        <p th:text="|*{date} in |" th:href="@{|/venuedetails/*{venue.id}|}">
            <p th:text="*{venue.venueName}"></p>
        </p>
        <p th:if="*{priceInEur != null or pricePresaleInEur != null}"
           th:text="|*{pricePresaleInEur} euro (voorverkoop) / *{priceInEur} euro (aan de kassa)|">
        </p>
        <h2 th:if="*{priceInEur == null && pricePresaleInEur == null}">Gratis Party</h2>
        <p th:text="|*{venue.city} (*{venue.distanceFromPublicTransportInKm} km van openbaar vervoer)|"></p>
        <p th:text="|deuren: *{doors}|">doors</p>
        <p th:text="*{extraInfo}">extraInfo</p>
        <div class="container mt-5">
            <div class="row">
                <div th:each="artist : ${party.artists}" class="col-4">
                    <div class="card-group">
                        <div class="card m-1 p-2 text-center">
                            <h3 th:text="${artist.artistName}"></h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${party.animals != null}">
            <p th:text="${party.animals.size()}"></p>  <!-- Toont de grootte van de dierenlijst -->
        </div>
        <div th:each="animalParty : ${party.animals}" class="col-4">
            <div class="card-group">
                <div class="card m-1 p-2 text-center">
                    <a th:href="@{|/animalDetails/${animalParty.id}|}">
                    <h3 th:text="${animalParty.animalname}"></h3> <!-- Zorg dat 'animal' goed wordt opgehaald -->
                    </a>
                </div>
            </div>
        </div>

    </main>
    <footer th:replace="~{fragments/header :: footerelement}"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
